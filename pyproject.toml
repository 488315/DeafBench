[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "deafbench"
version = "0.1.1"
description = "Accessibility-focused evaluation for AI captions and ASR systems."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = [
    "jiwer>=3.0.0,<4.0.0",
]

[project.optional-dependencies]
benchmark = [
    "numpy>=1.26",
    "WhisperSpeech>=0.8.9",
]
recorder = [
    "numpy>=1.26",
    "sounddevice>=0.5.1",
]
test = [
    "numpy>=1.26",
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
deafbench = "deafbench.cli:main"

[tool.setuptools.packages.find]
where = ["."]
exclude = ["tools", "tools.*"]

[tool.setuptools.package-data]
"deafbench.recorder.data" = ["*.jsonl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "unit: fast low-level tests for one function or module behavior",
    "integration: tests multiple DeafBench modules together",
    "functional: tests a complete CLI use case with filesystem I/O",
    "smoke: minimum package and CLI health checks",
]

[tool.coverage.run]
branch = true
source = ["deafbench"]
omit = ["deafbench/recorder/app.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90
