[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "deafbench"
version = "0.1.0"
description = "Accessibility-focused evaluation for AI captions and ASR systems."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = [
    "jiwer>=3.0.0,<4.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
deafbench = "deafbench.cli:main"

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "unit: fast low-level tests for one function or module behavior",
    "integration: tests multiple DeafBench modules together",
    "functional: tests a complete CLI use case with filesystem I/O",
    "smoke: minimum package and CLI health checks",
]

[tool.coverage.run]
branch = true
source = ["deafbench"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90
