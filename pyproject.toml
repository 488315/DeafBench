[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "deafbench"
version = "0.2.1"
description = "Accessibility-focused evaluation for AI captions and ASR systems."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "jiwer>=3.0.0,<4.0.0",
]

[project.urls]
Homepage = "https://488315.github.io/#work"
Repository = "https://github.com/488315/DeafBench"
Issues = "https://github.com/488315/DeafBench/issues"

[project.optional-dependencies]
benchmark = [
    "numpy>=1.26",
    "soundfile>=0.12",
    "WhisperSpeech>=0.8.9",
    "webdataset>=1.0.2,<2.0.0",
]
local-models = [
    "faster-whisper>=1.2.1,<2.0.0",
]
zero-custody-pilot = [
    "cryptography>=48.0,<49.0",
]
open-asr-evaluator = [
    "datasets==3.6.0",
    "kaldialign==0.12.0",
    "num2words==0.5.14",
    "regex==2026.7.19",
]
real-speech-dev = [
    "datasets==3.6.0; python_version < '3.14'",
    "numpy>=1.26",
    "scipy>=1.15,<2.0",
    "soundfile>=0.13,<1.0",
]
qwen-asr = [
    "scipy>=1.15,<2.0",
    "transformers[torch]>=5.13.0,<6.0.0",
]
parakeet-asr = [
    "nemo_toolkit[asr]>=2.4,<3",
    "numba>=0.61,<0.62",
]
granite-asr = [
    "scipy>=1.15,<2.0",
    "torchaudio>=2.8,<3.0",
    "transformers[torch]>=5.13.0,<6.0.0",
]
granite-nar-asr = [
    "accelerate>=1.10,<2.0",
    "flash-attn==2.8.3; platform_system == 'Linux'",
    "soundfile>=0.13,<1.0",
    "torch==2.9.1",
    "torchcodec==0.9.1",
    "torchaudio==2.9.1",
    "transformers>=5.5.3,<6.0.0",
]
ark-asr = [
    "librosa>=0.11,<1.0",
    "soundfile>=0.13,<1.0",
    "transformers[torch]>=4.57.6,<6.0.0",
]
ark-onnx-asr = [
    "librosa>=0.11,<1.0",
    "onnxruntime>=1.23,<2.0",
    "soundfile>=0.13,<1.0",
    "transformers[torch]>=4.57.6,<6.0.0",
]
recorder = [
    "numpy>=1.26",
    "sounddevice>=0.5.1",
]
test = [
    "cryptography>=48.0,<49.0",
    "kaldialign==0.12.0",
    "numpy>=1.26",
    "PyYAML>=6.0,<7.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.12,<0.13",
    "scipy>=1.15,<2.0",
    "soundfile>=0.13,<1.0",
]

[project.scripts]
deafbench = "deafbench.cli:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
namespaces = false
exclude = [
    "build",
    "build.*",
    "experiments",
    "experiments.*",
    "tests",
    "tests.*",
    "tools",
    "tools.*",
]

[tool.setuptools.package-data]
"deafbench" = [
    "model-registry.json",
    "licenses/*.txt",
    "licenses/**/*.txt",
    "remote-code-audits/*.json",
]
"deafbench.recorder.data" = ["*.jsonl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "unit: fast low-level tests for one function or module behavior",
    "integration: tests multiple DeafBench modules together",
    "functional: tests a complete CLI use case with filesystem I/O",
    "smoke: minimum package and CLI health checks",
]

[tool.coverage.run]
branch = true
patch = ["subprocess"]
source = ["deafbench"]
omit = ["deafbench/recorder/app.py"]

[tool.coverage.report]
omit = ["deafbench/recorder/app.py"]
show_missing = true
skip_covered = true
precision = 2
fail_under = 90.6
