[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "deafbench"
version = "0.1.0"
description = "Accessibility-focused evaluation for AI captions and ASR systems."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = [
    "jiwer>=3.0.0,<4.0.0",
]

[project.scripts]
deafbench = "deafbench.cli:main"

[tool.setuptools.packages.find]
where = ["."]
