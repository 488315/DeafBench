name: Publish DeafBench v0.1.1 release

on:
  push:
    branches:
      - automation/publish-v0.1.1
    paths:
      - ".github/workflows/publish-v0.1.1-release.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out automation branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_API_URL: ${{ github.api_url }}
          GH_REPOSITORY: ${{ github.repository }}
          RELEASE_TARGET: 7dfeacd1065c1a10b9dae0c15386f0d781aa17fd
        run: |
          set -euo pipefail

          release_url="${GH_API_URL}/repos/${GH_REPOSITORY}/releases/tags/v0.1.1"
          if curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${release_url}" >/dev/null 2>&1; then
            echo "v0.1.1 already exists"
            exit 0
          fi

          release_body="$(cat .github/release-notes-v0.1.1.md)"
          payload="$(jq -n \
            --arg tag "v0.1.1" \
            --arg target "${RELEASE_TARGET}" \
            --arg name "DeafBench v0.1.1" \
            --arg body "${release_body}" \
            '{
              tag_name: $tag,
              target_commitish: $target,
              name: $name,
              body: $body,
              draft: false,
              prerelease: false,
              make_latest: "true"
            }')"

          curl --fail-with-body -sS -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            "${GH_API_URL}/repos/${GH_REPOSITORY}/releases" \
            -d "${payload}"
