name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Run low-level unit tests
        run: python -m pytest -m unit

      - name: Run integration tests
        run: python -m pytest -m integration

      - name: Run functional tests
        run: python -m pytest -m functional

      - name: Run smoke tests
        run: python -m pytest -m smoke

      - name: Run full suite with coverage
        run: >-
          python -m pytest
          --cov=deafbench
          --cov-report=term-missing
          --cov-report=xml
          --junitxml=test-results.xml

      - name: Verify installed CLI
        run: >-
          python -m deafbench compare
          examples/references.jsonl
          examples/model-b.jsonl

      - name: Upload coverage and test results
        if: matrix.python-version == '3.14'
        uses: actions/upload-artifact@v7
        with:
          name: test-results-python-${{ matrix.python-version }}
          path: |
            coverage.xml
            test-results.xml
          if-no-files-found: error
