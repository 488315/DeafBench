name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  whisper-at:
    name: Whisper-AT compatibility
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install secure packaging stack and DeafBench
        run: |
          python -m pip install --upgrade pip "setuptools==83.0.0"
          python -m pip install ".[test]"

      - name: Install pinned Whisper-AT source
        run: python -m deafbench.whisper_at_compat

      - name: Verify backend import and adapter discovery
        run: >-
          python -I -c
          "import whisper_at;
          from deafbench.benchmark.models.whisper_at import _load_backend;
          assert _load_backend() is whisper_at"

      - name: Exercise Whisper-AT adapter smoke paths
        run: >-
          python -m pytest -q tests/test_benchmark_models.py
          -k whisper_at

      - name: Verify dependency health
        run: python -m pip check

  package:
    name: Clean wheel install
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"

      - name: Build wheel
        run: python -m pip wheel . --no-deps --wheel-dir dist

      - name: Install wheel into an isolated environment
        run: |
          python -m venv .wheel-venv
          .wheel-venv/bin/python -m pip install dist/deafbench-*.whl

      - name: Verify isolated package and CLI
        run: |
          .wheel-venv/bin/python -I -c "import deafbench; from deafbench.cli import main"
          .wheel-venv/bin/python -I -m deafbench --help

  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Reject tracked customer artifacts
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: >-
          python tools/check_customer_artifacts.py
          --tracked
          --base "$BASE_SHA"

      - name: Check Python formatting and lint
        run: python -m ruff check .

      - name: Compile Python sources
        run: python -m compileall -q deafbench tests tools

      - name: Verify frozen benchmark integrity
        run: >-
          python -m pytest -q
          tests/test_core_v1_freeze.py
          tests/test_synthetic_v2_freeze.py
          tests/test_stress_corpus.py
          tests/test_real_speech_dev.py

      - name: Run low-level unit tests
        run: python -m pytest -m unit

      - name: Run integration tests
        run: python -m pytest -m integration

      - name: Run functional tests
        run: python -m pytest -m functional

      - name: Run smoke tests
        run: python -m pytest -m smoke

      - name: Run full suite with coverage
        run: >-
          python -m pytest
          --cov=deafbench
          --cov-report=term-missing
          --cov-report=xml
          --junitxml=test-results.xml

      - name: Verify installed CLI
        run: >-
          python -m deafbench compare
          examples/references.jsonl
          examples/model-b.jsonl

      - name: Upload coverage and test results
        if: matrix.python-version == '3.14'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-results-python-${{ matrix.python-version }}
          path: |
            coverage.xml
            test-results.xml
          if-no-files-found: error
