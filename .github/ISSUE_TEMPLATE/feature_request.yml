name: Feature request
description: Propose a scoped improvement to DeafBench
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        DeafBench focuses on accessibility-critical ASR evaluation, reproducible
        measurement, and zero-custody customer-run audits. Do not attach customer
        audio, transcripts, secrets, or other sensitive data.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Explain the accessibility or evaluation problem without sensitive data.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the smallest useful behavior and its ownership boundary.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Validation evidence
      description: Describe how the change could be tested without customer data.
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Scope confirmation
      options:
        - label: The request is about DeafBench's evaluation or audit workflow.
          required: true
        - label: The request does not require publishing customer or regulated data.
          required: true
